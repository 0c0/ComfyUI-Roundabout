    workflow: image_boogu_image_edit_base.json
    description: Boogu Image Edit —— 单图编辑，擅长改写/添加图像内的文字，30 步（必须传 image）
    mode: image
    capabilities:
    - image-to-image
    output_node: '55'
    timeout: 300
    defaults:
      # 全局默认负向含 text / watermark，与「编辑图中文字」的用途冲突，这里清空
      negative_prompt: ''
      steps: 30
      cfg: 3.5
      sampler_name: dpmpp_2m
      scheduler: simple
      denoise: 1
    bindings:
      filename_prefix: 55.inputs.filename_prefix
      # 尺寸不绑：工作流内 ResizeImageMaskNode 把输入图缩到 1MP，EmptyLatentImage 的宽高来自 GetImageSize
      image: 32.inputs.image
      prompt: 45:36.inputs.prompt
      negative_prompt: 45:36.inputs.negative_prompt
      seed: 45:21.inputs.noise_seed
      cfg: 45:21.inputs.cfg
      steps: 45:26.inputs.steps
      sampler_name: 45:22.inputs.sampler_name
      scheduler: 45:26.inputs.scheduler
      denoise: 45:26.inputs.denoise
