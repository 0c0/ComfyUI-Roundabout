  # ===================== FastVideo FastH3 =====================
  # FastVideo 的 FastH3 蒸馏档（fastvideo_fasth3_8step_v2_pruned_int8_convrot + qwen3vl int8）。
  # 与 MiniMax H3 系的关键差别：文生视频那支的聚合节点是 MiniMaxH3ImageToVideo(105:104)，
  # 首尾帧走**关键帧**槽 first_frame / last_frame，而不是 Ref2VA 的 ref_image_N 参考 token；
  # 网关默认只认 ref_* 键名，所以这里用 image_keys 逐槽覆盖（见 gateway/registry.py 的 ref_key）。
  # reference_images 传 0 张=文生视频、1 张=首帧、2 张=首尾帧，未传的槽提交前由网关删除。
  #
  # ⚠️ 蒸馏只覆盖 fl2va（文生 + 首尾帧）：官方未发布 Ref2VA 蒸馏权重，所以 fasth3-edit
  #    复用同一份 fl2v 权重作**占位** —— 参考节点与槽位齐全，但条件对这份权重属未训练输入，
  #    效果未经标定。要稳的参考生视频走 minimax-h3-edit。
  #
  # 低显存：BlockSparseAttention(105:127，vsa / keep 10%) + MiniMaxChunkFeedForward(105:221)，
  #   两级与 base 四支同构。档位只生效 chunks / seq_threshold（head_chunks 无节点、highres_tiling
  #   无绑定）。FFN 分块开/关耗时无差 —— 分块收益在峰值显存、不在速度。
  # ⚠️ 本档定位草稿 / 快周转，不是 49/50 步的等价替代：09-20 分频实测 8 步在细节量上并非
  #    「无损」，高频段整体过量（越细越超）；要最大质量用 minimax-h3。
  fasth3:
    workflow: video_fastvideo_fasth3.json
    description: FastVideo FastH3 —— 文生视频 / 首尾帧生视频，8 步蒸馏档。定位草稿 / 快周转（官方口径 8 步最优、改步数掉质量），最大质量请用 minimax-h3
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '92'
    vram_adaptive: true
    timeout: 1800
    references:
      aggregator: '105:104'
      images:
      - '105:200'
      - '105:201'
      # 聚合节点上的键名：第 1 张=首帧、第 2 张=尾帧
      image_keys:
      - first_frame
      - last_frame
    defaults:
      width: 1344
      height: 768
      steps: 8
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 105:104.inputs.prompt
      seed: 105:15.inputs.noise_seed
      steps: 105:9.inputs.steps
      sampler_name: 105:17.inputs.sampler_name
      scheduler: 105:9.inputs.scheduler
      denoise: 105:9.inputs.denoise
      width: 105:104.inputs.width
      height: 105:104.inputs.height
      duration: 105:111.inputs.value
      fps: 105:91.inputs.fps
      chunks: 105:221.inputs.chunks
      seq_threshold: 105:221.inputs.seq_threshold
    aliases:
    - fastvideo-fasth3
    - fastvideo_fasth3
    - fast-h3
    - fasth3-t2v

  # 参考生视频版：聚合节点换成 MiniMaxH3ReferenceToVideo(105:145)，槽位就是默认的
  # ref_images.* / ref_videos.* / ref_audios.*，与其余 H3 编辑模型一致（6 图 + 3 视频 + 3 音频），
  # 参考视频与其音轨同源（GetVideoComponents 的两路输出），未提供时网关成对删除。
  #
  # ⚠️ 占位档：官方未蒸馏 Ref2VA，本档与 fasth3 共用同一份 fl2v 蒸馏权重
  #    （fastvideo_fasth3_8step_v2_pruned_int8_convrot），参考条件未训练、效果未标定。
  #    仅作「8 步 + 参考槽」的占位可用，生产请用 minimax-h3-edit。
  fasth3-edit:
    workflow: video_fastvideo_fasth3_edit.json
    description: FastVideo FastH3 Edit —— 参考图 / 视频 / 音频生视频，8 步蒸馏档。⚠️ 占位档：官方未蒸馏 Ref2VA，复用 fl2v 权重、参考效果未标定；生产请用 minimax-h3-edit
    mode: video
    capabilities:
    - text-to-video
    - reference-to-video
    output_node: '92'
    vram_adaptive: true
    timeout: 1800
    references:
      aggregator: '105:145'
      images:
      - '105:200'
      - '105:201'
      - '105:202'
      - '105:203'
      - '105:204'
      - '105:205'
      videos:
      - '105:206'
      - '105:207'
      - '105:208'
      audios:
      - '105:212'
      - '105:213'
      - '105:214'
    defaults:
      width: 1344
      height: 768
      steps: 8
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 105:145.inputs.prompt
      seed: 105:15.inputs.noise_seed
      steps: 105:9.inputs.steps
      sampler_name: 105:17.inputs.sampler_name
      scheduler: 105:9.inputs.scheduler
      denoise: 105:9.inputs.denoise
      width: 105:145.inputs.width
      height: 105:145.inputs.height
      duration: 105:111.inputs.value
      fps: 105:91.inputs.fps
      chunks: 105:221.inputs.chunks
      seq_threshold: 105:221.inputs.seq_threshold
    aliases:
    - fastvideo-fasth3-edit
    - fastvideo_fasth3_edit
    - fast-h3-edit
    - fasth3-reference

  # ===================== MiniMax H3 · Lift 确定性放大 =====================
  # lift 家族 = base / edit 的骨架 + 尾部一个 SelfLiftH3LatentLift(910)：
  #   采样 125 → latent lift 910 → 解码 122 → CreateVideo 130 → SaveVideo 92
  # 与源工作流的差别只有两处：122.inputs.samples 由 125 改接 910、保存前缀改 video/H3_Lift；
  # 新增节点 900 / 901（抽中间帧存预览 PNG）与 910（学习式 3D conv 抬分辨率）。
  # 两份工作流由 .workbuddy/build_lift_family.py 从 base / edit 派生——改了源图重跑脚本即可同步。
  #
  # 机制定位（09-20 实测）：低分一采拿结构 → lift 抬分辨率并铺学习高频 → 收尾。
  #   - rho 是**伪影阻尼**不是保细节（默认 0；拉向像素锚 = 白放大）；
  #   - 高分二采会洗掉 lift 的高频（54.4 vs 78.4），所以只做 lift、不做二采；
  #   - 输出尺寸 = 画布 × scale，默认 1344x768 × 1.875 = 2520x1440。
  #   - 步数 30（09-21 与 base / edit 统一）：原 defaults 的 8 是初始导入的漏值。
  # scale 是正式请求参数（仅 lift 两支有绑定）：默认 1.875 = 768p 画布 × 1.875 = 2520x1440。
  # rho / w_min / w_max 仍是模板固定值（节点 910），精调走 workflow_overrides（如 910.inputs.rho=0.3）。
  minimax-h3-lift:
    workflow: video_minimax_h3_lift.json
    description: MiniMax H3 Lift —— base 骨架 + 确定性放大：30 步原生采样→学习式 latent lift（默认 2520x1440），构图零重掷，纹理最强；支持首尾帧
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '92'
    references:
      aggregator: '136'
      images:
      - '137'
      - '139'
      image_keys:
      - first_frame
      - last_frame
    # 放大阶段要解码 2520x1440，比常规 H3 慢；想要完全不限时仍可设 JOB_TIMEOUT=0。
    timeout: 2700
    vram_adaptive: true
    defaults:
      width: 1344
      height: 768
      steps: 30
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
      scale: 1.875
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 138.inputs.value
      seed: 129.inputs.noise_seed
      steps: 124.inputs.steps
      sampler_name: 123.inputs.sampler_name
      scheduler: 124.inputs.scheduler
      denoise: 124.inputs.denoise
      width: 136.inputs.width
      height: 136.inputs.height
      duration: 132.inputs.value
      fps: 130.inputs.fps
      chunks: 158.inputs.chunks
      seq_threshold: 158.inputs.seq_threshold
      sparse_start_percent: '159.inputs.start_percent'
      scale: '910.inputs.scale'
    aliases:
    - minimax_h3_lift
    - h3-lift
    - h3lift
    - minimax-h3-upscale

  # Ref2VA 版 lift：放大机制与上面那支完全一致，差别只在工作流源于 edit ——
  #   ref2va 权重 + MiniMaxH3ReferenceToVideo 聚合 + 参考槽全套 6 图 / 3 视频 / 3 音频。
  # ⚠️ 未标定：步数 30（随 edit 统一），放大与参考的组合效果没做过 A/B。
  minimax-h3-lift-edit:
    workflow: video_minimax_h3_lift_edit.json
    description: MiniMax H3 Lift Ref2VA —— edit 骨架（30 步）+ 确定性放大：参考图 / 视频 / 音频生视频后过一遍学习式 latent lift
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    - reference-to-video
    output_node: '92'
    timeout: 2700
    vram_adaptive: true
    references:
      aggregator: '136'
      images:
      - '137'
      - '139'
      - '143'
      - '144'
      - '145'
      - '146'
      videos:
      - '153'
      - '154'
      - '155'
      audios:
      - '150'
      - '151'
      - '152'
    defaults:
      width: 1344
      height: 768
      steps: 30
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
      scale: 1.875
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 138.inputs.value
      seed: 129.inputs.noise_seed
      steps: 124.inputs.steps
      sampler_name: 123.inputs.sampler_name
      scheduler: 124.inputs.scheduler
      denoise: 124.inputs.denoise
      width: 136.inputs.width
      height: 136.inputs.height
      duration: 132.inputs.value
      fps: 130.inputs.fps
      chunks: 158.inputs.chunks
      seq_threshold: 158.inputs.seq_threshold
      sparse_start_percent: '159.inputs.start_percent'
      scale: '910.inputs.scale'
    aliases:
    - minimax_h3_lift_edit
    - minimax-h3-edit-lift
    - h3-lift-edit
    - h3lift-edit
    - ref2va-lift
