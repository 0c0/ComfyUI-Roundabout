default_model: qwen-image-2.1-turbo
defaults:
  params:
    negative_prompt: lowres, worst quality, blurry, jpeg artifacts, watermark, text,
      signature, deformed
  # 低显存分块档位表：按本机显存总量取「min_gb 不超过它」的最大一档，作为
  # chunks / head_chunks / seq_threshold / highres_tiling 的默认值。
  # 只有声明了 `vram_adaptive: true` 的模型会用它；模型自己的 defaults 覆盖档位值。
  # 改档位只动这里，不用碰代码。数值是经验标定（原始调优文档已不在仓库内）；`chunks` 只切
  # FFN 的 token 维、数学精确，改它不影响输出（分块耗时开销实测 ≈ 0）。
  # 落地：`chunks` / `seq_threshold` 在 4 支视频档都有 bind（158.inputs.*），提交时覆盖模板值。
  #   模板里写死的 6 / 4096 = 本表最低档，作用是「不经网关 / 探不到显存 / 未开 adaptive」时的
  #   兜底 —— 那几条旁路曾经是 1 / 262144（等于完全不分块），且没有任何测试守着。
  # ⚠️ `head_chunks` 自 09-21 起**没有任何模型绑定**：唯一消费它的 MiniMaxLowVRAMAttention
  #   与 BlockSparseAttention 硬互斥，已从 6 支视频档全部撤除（原因见下方 H3 系列共同点）。
  #   `highres_tiling` 同理**不按档位自动开**：SelfLiftH3Sampler 的这颗开关会改变画质
  #   （高分辨率段只保留第一块的音频预测），所以改由 lift 两支的 `params.highres_tiling`
  #   声明（default false）接管 —— 声明 default 优先级高于档位，请求里可显式开。
  #   这两列数值留在表里只为复原方便 —— **改它们不会影响任何工作流**。
  vram_tiers:
    - min_gb: 48
      chunks: 1
      head_chunks: 4
      seq_threshold: 262144
      highres_tiling: false
    - min_gb: 32
      chunks: 2
      head_chunks: 4
      seq_threshold: 262144
      highres_tiling: false
    - min_gb: 24
      chunks: 2
      head_chunks: 8
      seq_threshold: 16384
      highres_tiling: true
    - min_gb: 16
      chunks: 3
      head_chunks: 8
      seq_threshold: 12288
      highres_tiling: true
    - min_gb: 12
      chunks: 3
      head_chunks: 12
      seq_threshold: 4096
      highres_tiling: true
    - min_gb: 8
      chunks: 6
      head_chunks: 24
      seq_threshold: 4096
      highres_tiling: true
    - min_gb: 0
      chunks: 8
      head_chunks: 28
      seq_threshold: 4096
      highres_tiling: true
  # 注：这里**没有** quality_presets —— 2026-09-21 已整条移除。
  # 原分档只能表达 size + steps，与调用方直接传 `size` / `steps` 完全等价，
  # 多一层间接反而遮住真实参数（且曾让视频档误继承图像档把步数改成 40）。
  # 以后要快/慢切换：直接传 size + steps，别再引入 quality。
  style_presets:
    vivid:
      prompt_suffix: vivid saturated colors, high contrast, dramatic cinematic lighting,
        hyper-detailed
    natural:
      prompt_suffix: natural lighting, true-to-life colors, photographic, subtle tones
models:
  utility-birefnet-remove-background:
    workflow: utility_birefnet_remove_background.json
    description: 图片去背景（BiRefNet matting）—— 独立工具类，无 prompt，只需 image；输出透明 PNG，尺寸跟随输入图
    mode: image
    promptless: true
    capabilities:
    - image-to-image
    output_node: '22'
    timeout: 120
    defaults: {}
    bindings:
      image: 17.inputs.image
      filename_prefix: 22.inputs.filename_prefix
    aliases:
    - birefnet-remove-bg
    - utility_birefnet_remove_background
    - remove-background
  utility-seedvr2-upscale:
    workflow: utility_seedvr2_upscale.json
    description: "SeedVR2 7B Int8 图像放大 —— 独立工具类，无 prompt，只需 image；multiplier 倍率 1-8（默认 4），color_correction 可选 none/lab/wavelet/adain（默认 none）；输出尺寸 = 输入 × multiplier；⚠️ 8GiB 显存靠 offload 慢速可跑，大倍率 + 大图会显著变慢"
    mode: image
    promptless: true
    capabilities:
    - image-to-image
    output_node: '12'
    timeout: 1800
    defaults:
      multiplier: 4.0
      color_correction: none
    bindings:
      image: 1.inputs.image
      multiplier: 3.inputs.scale_by
      color_correction: 11.inputs.color_correction_method
      seed: 9.inputs.seed
      filename_prefix: 12.inputs.filename_prefix
    aliases:
    - seedvr2-upscale
    - utility_seedvr2_upscale
  utility-sam3-segment:
    workflow: utility_sam3_segment.json
    description: "SAM3.1 文本提示分割抠图 —— prompt = 要抠的目标描述（开放词汇，如 'the cat'），只需单图；threshold 置信度 0-1（默认 0.5）；输出 = 目标保留、背景透明的 PNG；与 BiRefNet 去背景的区别：按文本语义选目标，不是整图主体"
    mode: image
    capabilities:
    - image-to-image
    output_node: '6'
    timeout: 300
    defaults:
      threshold: 0.5
    bindings:
      prompt: 2.inputs.text
      image: 3.inputs.image
      threshold: 4.inputs.threshold
      filename_prefix: 6.inputs.filename_prefix
    aliases:
    - sam3-segment
    - utility_sam3_segment
  flux2-klein-image-edit-turbo:
    workflow: image_flux2_klein_image_edit_turbo.json
    description: Flux2 Klein 9B Edit Turbo —— 多图参考编辑 6 步快速版（参考图 + 提示词改写，Qwen3-VL 文本编码），尺寸跟随第一张参考图，输出约 1MP；参考图走 reference_images（最多 4 张）
    mode: image
    capabilities:
    - image-to-image
    output_node: '94'
    timeout: 600
    # 参考槽（多图编辑）：槽 1 是既有单槽（LoadImage 76），槽 2..4 各一条独立链路
    #   IMG{i} -> SC{i}(ImageScaleToTotalPixels) -> ENC{i}(VAEEncode)
    # 正/负 conditioning 各串一条 ReferenceLatent 链（latent 是可选的，留空即直通）。
    # 注意这里**没有 aggregator**：参考不是挂在同一个聚合节点上，而是各自独立接线。
    references:
      images:
      - '76'
      - 'IMG2'
      - 'IMG3'
      - 'IMG4'
      # 删槽时：删该槽独占的下游节点，并清空链上 RL 的 optional latent 键
      # （节点留着当直通，链因此不用重接）
      slots:
      - {}
      - nodes:
        - SC2
        - ENC2
        clear:
        - RLN2.latent
        - RLP2.latent
      - nodes:
        - SC3
        - ENC3
        clear:
        - RLN3.latent
        - RLP3.latent
      - nodes:
        - SC4
        - ENC4
        clear:
        - RLN4.latent
        - RLP4.latent
    defaults:
      negative_prompt: ''
      steps: 6
      cfg: 1
      sampler_name: euler
    bindings:
      filename_prefix: 94.inputs.filename_prefix
      image: 76.inputs.image
      prompt: 92:113.inputs.text
      negative_prompt: 92:87.inputs.text
      seed: 92:105.inputs.noise_seed
      cfg: 92:114.inputs.cfg
      steps: 92:115.inputs.steps
      sampler_name: 92:102.inputs.sampler_name
    aliases:
    - image-flux2-klein-image-edit-turbo   # 旧名，向后兼容
    - flux2-edit-turbo
    - image_flux2_klein_image_edit_turbo

  # ===================== Qwen-Image 2.1 =====================
  # 官方模板把真管线藏在 subgraph 里，这里是等价的 API 平铺版（节点 id 沿用官方，
  # 含 468 = ComfySwitchNode）。文生与编辑是**同一支管线**，不是两支：
  #   - 474（TextEncodeQwenImage21）自己就分路 —— 有参考图才把它们的 latent 拼进
  #     conditioning，一张没有则保持纯文本 + 视觉 token（节点内 keep_vision）；
  #   - 尺寸由 468 切：有参考图 → 474 出的 latent（跟随第 1 张参考图，resolution 缺省 0
  #     = 不缩放、只取整到 32）；无参考图 → 456 空 latent（width/height 直传，可非方图）。
  #     468.switch 由 gateway 按「本次有没有参考素材」推导（绑定名 use_custom_size）。
  # 因此**不能**给第 1 槽配 `image` binding：槽一旦被 binding 保护就删不掉，纯文生那一支
  # 会把模板占位图 `__REF_1__.png` 当参考喂进去。`image` 改由 pipeline 落成第 1 张参考图。
  qwen-image-2.1:
    workflow: image_qwen_image_2_1.json
    description: Qwen-Image 2.1 —— 文生图 / 多图参考编辑同支（25 步，Qwen3-VL 文本编码）；不带参考图即纯文生（size 直传，原生 2K、默认 1024x1024），带 1–6 张参考图则跟随第 1 张参考图的尺寸；⚠️ 迭代编辑每轮换新 seed（不传/-1 即随机）：同 seed 连续重绘残差噪声线性累加、画面变脏（09-28 实测）
    mode: image
    capabilities:
    - text-to-image
    - image-to-image
    output_node: '461'
    timeout: 600
    references:
      aggregator: '474'
      images:
      - L1
      - L2
      - L3
      - L4
      - L5
      - L6
      # TextEncodeQwenImage21 的参考槽是 COMFY_AUTOGROW_V3 ⇒ 键名 `images.image_N`（点号平铺）
      image_keys:
      - images.image_1
      - images.image_2
      - images.image_3
      - images.image_4
      - images.image_5
      - images.image_6
    defaults:
      negative_prompt: ''
      steps: 25
      cfg: 1
      sampler_name: euler
      scheduler: simple
      width: 1024
      height: 1024
    bindings:
      filename_prefix: 461.inputs.filename_prefix
      prompt: 474.inputs.prompt
      negative_prompt: 474.inputs.negative_prompt
      seed: 458.inputs.seed
      steps: 458.inputs.steps
      cfg: 458.inputs.cfg
      sampler_name: 458.inputs.sampler_name
      scheduler: 458.inputs.scheduler
      width: 456.inputs.width
      height: 456.inputs.height
      use_custom_size: 468.inputs.switch
    aliases:
    - qwen-image-21
    - qwen-image
    - qwen-image-2.1-edit   # 旧名，向后兼容
    - qwen-image-edit

  qwen-image-2.1-turbo:
    workflow: image_qwen_image_2_1_turbo.json
    description: >-
      Qwen-Image 2.1 Turbo —— 底模 int8 + Comfy-Org turbo_lora_avg_rank_178（从官方 8 步蒸馏
      checkpoint 抽取，非第三方另训）+ ManualSigmas 固定官方 sample_sigmas（1.0…0.414568,0）+
      SamplerCustomAdvanced(euler, CFG=1)。8 步出图（底模档 25 步的 ~3x），文生图 / 多图参考编辑
      与 qwen-image-2.1 同面（1-6 张参考图，带参考图跟随第 1 张尺寸）。⚠️ steps/cfg/sampler/scheduler
      参数对本档无效（落点焊死在 ManualSigmas，改步数须改工作流 490 的 sigmas 字符串）；
      turbo_lora=0 会坏（底模走 8 步官方落点没练过）。Qwen Research License 仅限非商用。
    mode: image
    capabilities:
    - text-to-image
    - image-to-image
    output_node: '461'
    timeout: 600
    references:
      aggregator: '474'
      images:
      - L1
      - L2
      - L3
      - L4
      - L5
      - L6
      # TextEncodeQwenImage21 的参考槽是 COMFY_AUTOGROW_V3 ⇒ 键名 `images.image_N`（点号平铺）
      image_keys:
      - images.image_1
      - images.image_2
      - images.image_3
      - images.image_4
      - images.image_5
      - images.image_6
    defaults:
      negative_prompt: ''
      width: 2048
      height: 2048
    params:
      turbo_lora:
        type: float
        min: 0
        max: 1.5
        default: 1.0
        bind: '480.inputs.strength_model'
        description: Turbo LoRA 强度（官方抽取版出厂 1.0）；⚠️ 0 = 底模直跑 8 步官方落点，画质必坏
    bindings:
      filename_prefix: 461.inputs.filename_prefix
      prompt: 474.inputs.prompt
      negative_prompt: 474.inputs.negative_prompt
      seed: 491.inputs.noise_seed
      width: 456.inputs.width
      height: 456.inputs.height
      use_custom_size: 468.inputs.switch
    aliases:
    - qwen-turbo
    - qwen-image-turbo
    - qwen_image_2_1_turbo

  # ===================== MiniMax H3 视频系列 =====================
  # 说明：聚合节点固定在 136、输出在 92；两支按「权重类型」分家，节点不同：
  #   - FL2VA（base / lift）：权重 *_fl2va_*，条件节点
  #     MiniMaxH3ImageToVideo —— 官方 t2v / i2v 模板同款，T2VA 与首尾帧共用，
  #     参考槽是关键帧 first_frame / last_frame（references.image_keys 覆盖键名）。
  #   - Ref2VA（-edit / -lift-edit）：权重 *_ref2va_*，条件节点
  #     MiniMaxH3ReferenceToVideo —— 参考槽是 6 图 / 3 视频 / 3 音频（*_ref2va_* 权重才吃这套）。
  #   共同点：
  #   - 提示词文本在 PrimitiveStringMultiline(138).inputs.value
  #   - 时长在 PrimitiveFloat(132).inputs.value（经 ComfyMathExpression 推导 length）
  #   - 种子在 RandomNoise(129).inputs.noise_seed
  #   - steps/scheduler/denoise 在 BasicScheduler(124)；sampler_name 在 KSamplerSelect(123)
  #   - width/height 在 aggregator(136)；fps 在 CreateVideo(130)
  #   - 未上传的资源由网关在发送前动态删除对应节点（删 LoadVideo 会级联删其 GetVideoComponents，
  #     见 references 段与 gateway/pipeline.py 的 _prune_unused_references）。
  #   - 低显存统一两级：注意力档(159) → MiniMaxChunkFeedForward(158)。
  #     159 四支统一 **MiniMaxH3SparkAttentionSM86**（Spark-H3，SM86 原生；需 comfy-kitchen 的
  #     Spark 变体 >= 0.2.39+spark.h3.sm86 —— PyPI 上同版本号没有 spark_attn）。
  #     档位开关是 **`mode`**（fidelity / speed / custom / dense），**不是 `enabled`**：老版本的
  #     `enabled` 落点是死键，写上去照样命中、值却没人读。
  #     h3 两支模板写 fidelity（20 步全功能）；lift 两支写 speed + steps=8（配 8 步 turbo 配方）。
  #     ⛔ **不能再接** KJNodes 的 MiniMaxLowVRAMAttention：它替换 `block.forward`，而稀疏的 block
  #     patch 会无条件补传 `attention=` 关键字（comfy/ldm/minimax/model.py:753），签名对不上
  #     ⇒ 实测 TypeError。base 四支原先的 LowVRAM 节点已按此撤除（09-21）。
  #     ⚠️ 承载对外 `attention` 的可注入键四支统一为 `spark_mode`：sparse→fidelity / dense→dense
  #     （dense 完全旁路 Spark）。lift 两支模板值已是 speed，**日常别传 `attention`**
  #     （传 sparse 会把它顶回 fidelity，全功能但慢）。Spark 的 warmup_ratio / topk_ratio / strict
  #     未注册 ⇒ 只能改工作流 JSON 或走 workflow_overrides。
  minimax-h3:
    workflow: video_minimax_h3.json
    description: MiniMax H3 (FL2VA) —— 生成档：文生视频 / 首尾帧 / 参考图（留在本档，不换档）/ 帧+参考组合；请求带 reference_videos / reference_audios 时自动换档到 minimax-h3-edit（09-25 实测 FL2VA 不迁移音色/动作，参考内容只有 Ref2VA 消费）；**注意力档 = Spark-H3 (SM86)**：`attention` 取 `sparse`（默认，Spark 稀疏）或 `dense`（关闭，Spark 节点原样透传模型），20 步，低显存分块按档位自适应；Turbo 快档：`turbo_lora` 强度（0=关默认，1.0=8 步蒸馏，配 steps≈8）
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '92'
    timeout: 1800
    route:
      reference_videos: minimax-h3-edit
      reference_audios: minimax-h3-edit
    references:
      aggregator: '136'
      frame_params: [first_frame, last_frame]
      images:
      - '137'
      - '139'
      - '170'
      - '171'
      - '172'
      - '173'
      - '174'
      - '175'
      image_keys:
      - first_frame
      - last_frame
      - ref_images.ref_image_0
      - ref_images.ref_image_1
      - ref_images.ref_image_2
      - ref_images.ref_image_3
      - ref_images.ref_image_4
      - ref_images.ref_image_5
    vram_adaptive: true
    defaults:
      width: 1344
      height: 768
      steps: 20
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24

    # 模型自述参数（v1.43.0）：声明即注册——bind 并入 bindings、default 并入 defaults、
    # 类型/范围在请求入口校验、tool-info 元数据取自这里。加新参数只写这里，不动 Python。
    params:
      turbo_lora:
        type: float
        min: 0
        max: 1.5
        default: 0
        bind: '160.inputs.strength_model'
        description: Turbo LoRA 强度，0=关（默认，零开销）；1.0=8 步蒸馏 Turbo，需配 steps≈8
      video_shift:
        type: float
        min: 0.01
        max: 100
        default: 12.0
        bind: '162.inputs.shift_video'
        description: 视频 flow shift（音频维固定 3）。基模 20 步用 12（默认）；开 turbo_lora 时自动切 6（768p 蒸馏 LoRA 的训练值），显式传值优先
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 138.inputs.value
      seed: 129.inputs.noise_seed
      steps: [124.inputs.steps, 159.inputs.steps]
      sampler_name: 123.inputs.sampler_name
      scheduler: 124.inputs.scheduler
      denoise: 124.inputs.denoise
      width: [136.inputs.width, 147.inputs.width, 161.inputs.width]
      height: [136.inputs.height, 147.inputs.height, 161.inputs.height]
      duration: 132.inputs.value
      fps: 130.inputs.fps
      chunks: 158.inputs.chunks
      seq_threshold: 158.inputs.seq_threshold
      spark_mode: '159.inputs.mode'
    aliases:
    - minimax_h3
    - minimaxh3
    - h3
  minimax-h3-edit:
    workflow: video_minimax_h3_edit.json
    description: MiniMax H3 Edit (Ref2VA) —— 编辑档：参考视频编辑 / 动作·运镜迁移 / 音频复用 / 参考图；**注意力档 = Spark-H3 (SM86)**：`attention` 取 `sparse`（默认，Spark 稀疏）或 `dense`（关闭，Spark 节点原样透传模型）；20 步，低显存分块按档位自适应；Turbo 快档：`turbo_lora` 强度（0=关默认，1.0=ref2v 8 步蒸馏，配 steps≈8）
    mode: video
    capabilities:
    - text-to-video
    - reference-to-video
    output_node: '92'
    timeout: 1800
    references:
      aggregator: '136'
      images:
      - '137'
      - '139'
      - '143'
      - '144'
      - '145'
      - '146'
      videos:
      - '153'
      - '154'
      - '155'
      audios:
      - '150'
      - '151'
      - '152'
    vram_adaptive: true
    defaults:
      width: 1344
      height: 768
      steps: 20
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
    # 模型自述参数（v1.43.0）：声明即注册——bind 并入 bindings、default 并入 defaults、
    # 类型/范围在请求入口校验、tool-info 元数据取自这里。加新参数只写这里，不动 Python。
    params:
      turbo_lora:
        type: float
        min: 0
        max: 1.5
        default: 0
        bind: '160.inputs.strength_model'
        description: Turbo LoRA 强度，0=关（默认，零开销）；1.0=8 步蒸馏 Turbo，需配 steps≈8
      video_shift:
        type: float
        min: 0.01
        max: 100
        default: 12.0
        bind: '162.inputs.shift_video'
        description: 视频 flow shift（音频维固定 3）。基模 20 步用 12（默认）；开 turbo_lora 时自动切 6（768p 蒸馏 LoRA 的训练值），显式传值优先
      vpack_ratio:
        type: str
        default: auto
        choices: [auto, '0/5', '1/5', '2/5', '3/5']
        bind: '970.inputs.compression_ratio'
        description: 参考视频 latent 压缩档：auto=带参考视频时 2/5、无则 0/5 直通；0/5 不压缩 / 1/5 轻 / 2/5 官方推荐 / 3/5 最强（每 5 帧留 2 帧）。只压参考视频的时间维，空间与生成 latent 不变
    bindings:
      filename_prefix: 92.inputs.filename_prefix
