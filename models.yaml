  # ===================== FastVideo FastH3 · SelfLift 渐进放大 =====================
  # 在 fasth3 基础上把单阶段采样换成 SelfLift：低分辨率前缀跑粗结构 → 学习式 3D conv
  # upscaler 抬分辨率 → 高分收尾。机制与 minimax-h3-self-lift 同族，但 fasth3 链上有
  # MiniMaxH3SigmaShift(shift_video=10)，会把 σ 网格挤向高噪端，因此 σ 标定三元组
  # （extra_steps / start_at_sigma / transition_step）必须重算，不能照抄 self-lift 的
  # 1 / 0.7 / 5 —— 照抄会把 σ_resume 顶到 0.77，等于让高分阶段去干低分的粗活。
  # 默认档 = 实测推荐值：steps=8 / extra_steps=2 / start_at_sigma=0.9 / transition_step=8
  #   → σ_resume≈0.296（低分 8 步 + 高分 2 步），画质与基线相当而耗时约 -46%。
  # ⚠ steps 与 transition_step 是耦合的（σ 网格点数随 steps 变）：
  #   改 steps 必须同步重算 transition_step，标定方法见 skill: selflift-progressive-upscale。
  #   例：steps=10 时取 extra_steps=2 / start_at_sigma=0.95 / transition_step=9 → σ_resume≈0.289。
  #   合法区间：1 <= transition_step <= steps + extra_steps - 1（网关会在提交前拦下越界值）。
  # extra_steps / start_at_sigma 是**模板里固定**的 σ 标定值（节点 300），不在可注入白名单里 ——
  # defaults 段里保留一份副本仅供网关做范围校验与文档说明，改它们要直接改工作流 JSON。
  # 硬约束：采样器只能是 euler（SelfLiftH3Sampler 内部校验）；高分阶段至少留 2 步，
  #   只给 1 步会明显发灰发软（实测反例见高显存分块调优文档）。
  fastvideo-fasth3-self-lift:
    workflow: video_fastvideo_fasth3_self_lift.json
    description: FastVideo FastH3 SelfLift —— 文生视频 / 首尾帧生视频，低分前缀→高分收尾渐进采样，同档画质约省 46% 耗时
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '92'
    # 渐进采样要多跑一轮高分辨率阶段，给更宽窗口；要完全不限时仍可设 JOB_TIMEOUT=0。
    timeout: 3600
    references:
      aggregator: '105:104'
      images:
      - '105:200'
      - '105:201'
      # 与 fasth3 一致：第 1 张=首帧、第 2 张=尾帧（关键帧槽，不是参考 token）
      image_keys:
      - first_frame
      - last_frame
    defaults:
      width: 1344
      height: 768
      steps: 8
      # 下面三项是 SelfLift 的 σ 标定三元组，与 steps 耦合，须成组调整
      extra_steps: 2
      start_at_sigma: 0.9
      transition_step: 8
      # 低分前缀比例：auto = 按目标尺寸反推，把低分长边压在 H3 原生画布 1344 上
      # （1080p→0.70、2K→0.525、4K→0.35；依据见 skill: selflift-progressive-upscale 的
      # 《一采分辨率扫描》）。显式传数字仍可覆盖；>0.70 会越过原生画布，网关会告警。
      lowres_scale: auto
      sampler_name: euler
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
      highres_tiling: true
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 105:104.inputs.prompt
      seed: 302.inputs.seed
      steps: 105:9.inputs.steps
      sampler_name: 105:17.inputs.sampler_name
      scheduler: 105:9.inputs.scheduler
      denoise: 105:9.inputs.denoise
      width: 105:104.inputs.width
      height: 105:104.inputs.height
      duration: 105:111.inputs.value
      fps: 105:91.inputs.fps
      transition_step: 302.inputs.transition_step
      lowres_scale: 302.inputs.lowres_scale
      highres_tiling: 302.inputs.highres_tiling
    aliases:
    - fastvideo_fasth3_self_lift
    - fasth3-self-lift
    - fasth3-selflift
    - fasth3-lift
    - fast-h3-self-lift

