default_model: z-image-turbo
defaults:
  params:
    negative_prompt: lowres, worst quality, blurry, jpeg artifacts, watermark, text,
      signature, deformed
  # 低显存分块档位表：按本机显存总量取「min_gb 不超过它」的最大一档，作为
  # chunks / head_chunks / seq_threshold / highres_tiling 的默认值。
  # 只有声明了 `vram_adaptive: true` 的模型会用它；模型自己的 defaults 覆盖档位值。
  # 改档位只动这里，不用碰代码。数值依据见 H3-SelfLift 分块调优文档第五节。
  vram_tiers:
    - min_gb: 48
      chunks: 1
      head_chunks: 4
      seq_threshold: 262144
      highres_tiling: false
    - min_gb: 32
      chunks: 2
      head_chunks: 4
      seq_threshold: 262144
      highres_tiling: false
    - min_gb: 24
      chunks: 2
      head_chunks: 8
      seq_threshold: 16384
      highres_tiling: true
    - min_gb: 16
      chunks: 3
      head_chunks: 8
      seq_threshold: 12288
      highres_tiling: true
    - min_gb: 12
      chunks: 3
      head_chunks: 12
      seq_threshold: 4096
      highres_tiling: true
    - min_gb: 8
      chunks: 6
      head_chunks: 24
      seq_threshold: 4096
      highres_tiling: true
    - min_gb: 0
      chunks: 8
      head_chunks: 28
      seq_threshold: 4096
      highres_tiling: true
  quality_presets:
    low:
      steps: 12
    standard:
      steps: 25
    medium:
      steps: 25
    hd:
      steps: 40
    high:
      steps: 40
  style_presets:
    vivid:
      prompt_suffix: vivid saturated colors, high contrast, dramatic cinematic lighting,
        hyper-detailed
    natural:
      prompt_suffix: natural lighting, true-to-life colors, photographic, subtle tones
