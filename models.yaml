  # ===================== HyperFlow 8 步 LoRA =====================
  # Video Rebirth 的 HyperFlow（无数据流自蒸馏）8 步 LoRA，社区有 ComfyUI 转换版。
  # 拓扑与 turbo 同构（base 权重 minimax_h3_fl2va_int8_convrot + LoRA），差别只在：
  #   - LoRA 换成 HyperFlow（strength 1.0，官方推荐起点）
  #   - 采样器换成 euler，σ 换成 ManualSigmas 写死的 LoRA 官方 9 点序列。
  #     ⚠ 不能靠 BasicScheduler(simple)：它在 shift=12 下给出的 8 步网格到第 8 步才降到 0.63
  #     （几乎没降噪），与官方序列最大差 0.639 —— 2026-09-19 实测就是它把音频压到 -40.5 dB、
  #     画面发糊的根因。内建 scheduler 无一能复现官方序列（最接近的 beta 也差 0.56）。
  #     所以 124 是 ManualSigmas 而非 BasicScheduler，steps / scheduler / denoise 都没有绑定：
  #     **本档步数由 σ 点数固定为 8，不是可调参数**（同蒸馏档的既有教训）。
  # ⚠ LoRA 文件必须与 base 形态配对：本工作流挂的是**完整版** base，
  #   所以只能用非 pruned 文件。pruned 版是给 curve-form 权重（如 FastH3 那支
  #   fastvideo_fasth3_8step_v2_pruned）用的；挂错会 key 不匹配 → LoRA 静默不加载。
  # 低显存分块同 turbo（KJNodes 两支，按档位自适应）。
  minimax-h3-hyperflow:
    workflow: video_minimax_h3_hyperflow.json
    description: MiniMax H3 + HyperFlow 8 步 LoRA —— 文生视频 / 参考生视频，8 步快速档（euler + 固定 9 点 σ）
    mode: video
    capabilities:
    - text-to-video
    output_node: '92'
    timeout: 1800
    vram_adaptive: true
    references:
      aggregator: '136'
      images:
      - '137'
      - '139'
      - '143'
      - '144'
      - '145'
      - '146'
      videos:
      - '153'
      - '154'
      - '155'
      audios:
      - '150'
      - '151'
      - '152'
    defaults:
      width: 1344
      height: 768
      sampler_name: euler
      duration: 5
      fps: 24
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 138.inputs.value
      seed: 129.inputs.noise_seed
      sampler_name: 123.inputs.sampler_name
      width: 136.inputs.width
      height: 136.inputs.height
      duration: 132.inputs.value
      fps: 130.inputs.fps
      chunks: 158.inputs.chunks
      head_chunks: 157.inputs.head_chunks
      seq_threshold: 158.inputs.seq_threshold
    aliases:
    - minimax_h3_hyperflow
    - hyperflow
    - h3-hyperflow

  # ===================== MiniMax H3 SelfLift 变体 =====================
  # 拓扑与前四个 H3 不同：走 SelfLiftH3Sampler 渐进采样（低分辨率 NFE + 高分辨率 NFE），
  # 聚合节点仍是 MiniMaxH3ReferenceToVideo(136)，输出是 SaveVideo(238) 而非 92。
  # 文生视频 / 首尾帧生视频靠两个 LoadImage 的插拔区分：都旁路（或在请求里不传
  # reference_images）即文生视频；接上 ref_image_0 / ref_image_1 即带图生成。
  # 请求未提供的图由网关在提交前删掉对应 LoadImage，见 gateway/pipeline.py 的
  # _prune_unused_references。
  # 分块参数（chunks / head_chunks / seq_threshold / highres_tiling）不写死在这里，
  # 由 `vram_adaptive` 按本机显存从 defaults.vram_tiers 取档（显存探测见 gateway/vram.py）。
  minimax-h3-self-lift:
    workflow: video_minimax_h3_self_lift.json
    description: MiniMax H3 SelfLift —— 文生视频 / 首尾帧生视频，基础权重直跑两阶段渐进采样（无 LoRA），参数按显存自动分档
