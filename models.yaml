  # ===================== MiniMax H3 · SelfLift 一体化精修 =====================
  # lift 家族 = base / edit 骨架 + **SelfLiftH3Sampler(125)**：
  #   条件 136 → 125（低分前缀 + 一次性学习式升采样）→ 解码 122/121 → 130 → 92
  # 与 base 的差别：125 顶替 SamplerCustomAdvanced、删 BasicGuider(126) 把它的 conditioning
  # 直接喂给 125.positive、negative 走 ConditioningZeroOut(300)；旧版 910/900/901 已全部退役。
  #
  # 配方（8 步 turbo）：steps=8、sampler=euler、turbo_lora=1.0、lowres_scale=0.75、
  #   transition_step=5 —— 前 5 步在 0.75 前缀上跑，其余 3 步全分辨率，升采样只发生一次。
  #   - **采样器只能是 euler**：节点内对 sampler_function 有硬断言（sample_euler），换别的直接报错。
  #   - **输出尺寸 = `size`**：没有放大倍率；`scale` 已下线（传了 400），`output_size` 是同义入口。
  #   - lowres_scale 越低越省，但升采样要补的跨度变大；1.0 = 前缀与输出同尺寸（白付一次放大）。
  #   - transition_step 逼近总步数 ⇒ 前缀吃满、全分辨率没步可跑，等于退回低分生成。
  #   - 不含 teacache(185)：8 步档没多少步可省。
  # 两套工作流由 .workbuddy/build_lift_family.py 从 base / edit 派生（改源图后重跑即可同步）。
  minimax-h3-lift:
    workflow: video_minimax_h3_lift.json
    description: MiniMax H3 SelfLift —— 生成档骨架 + SelfLift 一体化精修（8 步 turbo）：先在 `lowres_scale`（默认 0.75）的低分辨率前缀上跑 `transition_step` 步，再用一次性学习式升采样把同一条轨迹拉到全分辨率；NFE 与普通 8 步档相同，构图零重掷。**`size` 就是输出尺寸**（不再有放大倍率）；支持首尾帧 / 参考图（留在本档）；请求带 reference_videos / reference_audios 时自动换档到 minimax-h3-lift-edit
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '92'
    route:
      reference_videos: minimax-h3-lift-edit
      reference_audios: minimax-h3-lift-edit
    references:
      aggregator: '136'
      frame_params: [first_frame, last_frame]
      images:
      - '137'
      - '139'
      - '170'
      - '171'
      - '172'
      - '173'
      - '174'
      - '175'
      image_keys:
      - first_frame
      - last_frame
      - ref_images.ref_image_0
      - ref_images.ref_image_1
      - ref_images.ref_image_2
      - ref_images.ref_image_3
      - ref_images.ref_image_4
      - ref_images.ref_image_5
    timeout: 1800
    vram_adaptive: true
    defaults:
      width: 1344
      height: 768
      steps: 8
      sampler_name: euler
      scheduler: simple
      denoise: 1
      duration: 5
      fps: 24
      lowres_scale: 0.75
    # 模型自述参数（v1.43.0）：声明即注册——bind 并入 bindings、default 并入 defaults、
    # 类型/范围在请求入口校验、tool-info 元数据取自这里。加新参数只写这里，不动 Python。
    params:
      turbo_lora:
        type: float
        min: 0
        max: 1.5
        default: 1.0
        bind: '160.inputs.strength_model'
        description: Turbo LoRA 强度。SelfLift 配方按 8 步蒸馏轨迹标定，**默认 1.0**；设 0 会让低分前缀跑在未蒸馏轨迹上，画质必坏
      video_shift:
        type: float
        min: 0.01
        max: 100
        default: 12.0
        bind: '162.inputs.shift_video'
        description: 视频 flow shift（音频维固定 3）。基模 20 步用 12（默认）；开 turbo_lora 时自动切 6（768p 蒸馏 LoRA 的训练值），显式传值优先
      lowres_scale:
        type: float
        min: 0.25
        max: 1.0
        default: 0.75
        bind: '125.inputs.lowres_scale'
        description: 低分辨率前缀的空间比例（论文 0.5，实测配方 0.75）。越小越快，细节越依赖升采样阶段
      transition_step:
        type: int
        min: 1
        max: 8
        default: 5
        bind: '125.inputs.transition_step'
        description: 低分辨率阶段消耗的采样步数（8 步里用 5，其余在全分辨率上跑）；升到 8 = 全程低分，失去精修意义
      highres_tiling:
        type: bool
        default: false
        bind: '125.inputs.highres_tiling'
        description: 高分辨率阶段分块（按剩余显存选 1–8 块）。8 GiB 上开到 true 可显著降峰值显存；**实验性**——节点只保留第一块的音频预测、画质与耗时都会变，故默认关、按请求显式开
    bindings:
      filename_prefix: 92.inputs.filename_prefix
      prompt: 138.inputs.value
      seed: [129.inputs.noise_seed, 125.inputs.seed]
      steps: [124.inputs.steps, 159.inputs.steps]
      sampler_name: 123.inputs.sampler_name
      scheduler: 124.inputs.scheduler
      denoise: 124.inputs.denoise
      width: [136.inputs.width, 147.inputs.width, 161.inputs.width]
      height: [136.inputs.height, 147.inputs.height, 161.inputs.height]
      duration: 132.inputs.value
      fps: 130.inputs.fps
      chunks: 158.inputs.chunks
      seq_threshold: 158.inputs.seq_threshold
      spark_mode: '159.inputs.mode'
    aliases:
    - minimax_h3_lift
    - h3-lift
    - h3lift
    - minimax-h3-upscale

