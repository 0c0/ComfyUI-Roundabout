      steps: 57:3.inputs.steps
      cfg: 57:3.inputs.cfg
      sampler_name: 57:3.inputs.sampler_name
      scheduler: 57:3.inputs.scheduler
      denoise: 57:3.inputs.denoise
      width: 57:13.inputs.width
      height: 57:13.inputs.height
