  # ===================== MiniMax H3 SelfLift 变体 =====================
  # 拓扑与前四个 H3 不同：走 SelfLiftH3Sampler 渐进采样（低分辨率 NFE + 高分辨率 NFE），
  # 聚合节点仍是 MiniMaxH3ReferenceToVideo(136)，输出是 SaveVideo(238) 而非 92。
  # 文生视频 / 首尾帧生视频靠两个 LoadImage 的插拔区分：都旁路（或在请求里不传
  # reference_images）即文生视频；接上 ref_image_0 / ref_image_1 即带图生成。
  # 请求未提供的图由网关在提交前删掉对应 LoadImage，见 gateway/pipeline.py 的
  # _prune_unused_references。
  # 分块参数（chunks / head_chunks / seq_threshold / highres_tiling）不写死在这里，
  # 由 `vram_adaptive` 按本机显存从 defaults.vram_tiers 取档（显存探测见 gateway/vram.py）。
  minimax-h3-self-lift:
    workflow: video_minimax_h3_self_lift.json
    description: MiniMax H3 SelfLift —— 文生视频 / 首尾帧生视频，渐进式低分→高分采样，参数按显存自动分档
    mode: video
    capabilities:
    - text-to-video
    - image-to-video
    output_node: '238'
    # SelfLift 要比常规 H3 多跑一轮高分辨率阶段，给更宽的窗口；
    # 想要完全不限时仍可设 JOB_TIMEOUT=0。
    timeout: 3600
    vram_adaptive: true
    references:
      aggregator: '136'
      images:
      - '150'
      - '164'
    defaults:
      width: 1344
      height: 768
      # 默认档：motion 未显式传时落回这里（等同 story = 6 / 5）。
      # 下面的 steps / transition_step 与 story 档同值，只是兜底——档表才是默认值的来源。
      motion: story
      steps: 6
      transition_step: 5
      sampler_name: euler
      scheduler: simple
      denoise: 1
      duration: 10
      fps: 24
    bindings:
      filename_prefix: 238.inputs.filename_prefix
      prompt: 232.inputs.value
      seed: 235.inputs.seed
      steps: 124.inputs.steps
      sampler_name: 123.inputs.sampler_name
      scheduler: 124.inputs.scheduler
      denoise: 124.inputs.denoise
      width: 136.inputs.width
      height: 136.inputs.height
      duration: 132.inputs.value
      fps: 234.inputs.fps
      chunks: 219.inputs.chunks
      head_chunks: 220.inputs.head_chunks
      seq_threshold: 219.inputs.seq_threshold
      highres_tiling: 235.inputs.highres_tiling
      transition_step: 235.inputs.transition_step
    # 文戏 / 打戏差的只有「总步数 + 过渡步」两个数，单独传容易配错，打包成命名档：
    # 请求里写 "motion": "story" / "fight" 即可。显式传 steps / transition_step 仍可覆盖。
    # 不传 motion 时按 defaults.motion 走（默认 story）。
    motion_presets:
      story:
        steps: 6
        transition_step: 5
      fight:
        steps: 8
        transition_step: 6
    aliases:
    - minimax_h3_self_lift
    - minimaxh3selflift
    - h3-selflift
    - h3-self-lift
    - selflift
    - self-lift

  # Ref2VA 版 SelfLift：采样链路、低显存分块、显存分档与上面那支完全一致，
  # 差别只在 UNET 换 ref2va 权重、LoRA 换 ref2v turbo 4step，参考槽扩为全套 6 图 + 3 视频 + 3 音频。
  # 参考视频与其音轨同源（GetVideoComponents 的两个输出），未提供时网关成对删除。
  minimax-h3-self-lift-edit:
