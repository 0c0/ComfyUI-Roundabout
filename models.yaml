default_model: z-image-turbo
defaults:
  params:
    negative_prompt: lowres, worst quality, blurry, jpeg artifacts, watermark, text,
      signature, deformed
  quality_presets:
    low:
      steps: 12
    standard:
      steps: 25
    medium:
      steps: 25
    hd:
      steps: 40
    high:
      steps: 40
  style_presets:
    vivid:
      prompt_suffix: vivid saturated colors, high contrast, dramatic cinematic lighting,
        hyper-detailed
    natural:
      prompt_suffix: natural lighting, true-to-life colors, photographic, subtle tones
models:
  z-image:
    workflow: image_z_image_base.json
    description: Z-Image base —— AuraFlow 架构完整模型，30 步高精度
    mode: image
    capabilities:
    - text-to-image
    output_node: '95'
    timeout: 300
    defaults:
      width: 1024
      height: 1024
      steps: 30
      cfg: 3
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
    bindings:
      filename_prefix: 95.inputs.filename_prefix
      prompt: 76:67.inputs.text
      negative_prompt: 76:71.inputs.text
      seed: 76:69.inputs.seed
      steps: 76:69.inputs.steps
      cfg: 76:69.inputs.cfg
      sampler_name: 76:69.inputs.sampler_name
      scheduler: 76:69.inputs.scheduler
      denoise: 76:69.inputs.denoise
      width: 76:68.inputs.width
      height: 76:68.inputs.height
    aliases:
    - zimage
    - z_image
    - z-image-base
  z-image-turbo:
    workflow: image_z_image_turbo.json
    description: Z-Image Turbo —— AuraFlow 架构 int8 蒸馏模型，8 步出图
    mode: image
    capabilities:
    - text-to-image
    output_node: '9'
    timeout: 300
    defaults:
      width: 1024
      height: 1024
      steps: 8
      cfg: 1
      sampler_name: res_multistep
      scheduler: simple
      denoise: 1
    bindings:
