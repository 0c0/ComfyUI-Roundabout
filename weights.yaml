# 内置工作流引用的权重 → 下载来源（唯一真源）。
#
# 为什么需要这份文件：工作流 JSON 里只有**文件名**，没有它来自哪个 HF 仓库 ——
# 光看 workflows/*.json 推不出下载地址。网关据此做两件事：
#   1) 「权重未安装」的 400 报错里**直接附上可复制的下载命令**（gateway/weights.py）；
#   2) 按需体检：REST `GET /roundabout/admin/weights`、MCP `check_weights`，
#      列出当前缺哪些权重 —— 不做启动预扫，也不在每发生成前 preflight。
#
# 维护：新增/下线工作流时同步本文件；`tests/test_weights_index.py` 会核它与
# README.md 两张权重表、以及 workflows/*.json 的实际引用三者一致。
# 体积为十进制 GB（与 README 同口径）。字段 path 是 **repo 内完整路径**（末段即上游文件名）。

mirrors:
  hf: https://hf-mirror.com                  # 国区默认；官方为 https://huggingface.co
  modelscope: https://modelscope.cn/models   # 备用源：域名与 models 段换掉、resolve/main -> resolve/master

# 上游文件名 → 工作流引用的名字（内置工作流里只有这一个需要改名）
rename:
  minimax_h3_latent_upscaler_3d_conv_v1_fp16.safetensors: minimax_h3_latent_upscaler_3d_fp16.safetensors

